<!doctype html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; background: #10131f; color: white; font-family: Arial, sans-serif; }
main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 22px; }
figure { margin: 0; background: #171c2b; border: 1px solid rgba(255,255,255,.14); }
img { width: 100%; display: block; }
figcaption { text-align: center; font-size: 24px; font-weight: 700; letter-spacing: .08em; padding: 10px; text-transform: uppercase; }
</style></head><body><main><figure><img src="neutral.png" /><figcaption>neutral</figcaption></figure>
<figure><img src="happy.png" /><figcaption>happy</figcaption></figure>
<figure><img src="sad.png" /><figcaption>sad</figcaption></figure>
<figure><img src="angry.png" /><figcaption>angry</figcaption></figure>
<figure><img src="surprised.png" /><figcaption>surprised</figcaption></figure>
<figure><img src="thinking.png" /><figcaption>thinking</figcaption></figure></main></body></html>
